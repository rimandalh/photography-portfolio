<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photography Portfolio</title>
    
    <!-- Swiper.js Stylesheet (Handles the presentation slider structure) -->
    <link rel="stylesheet" href="https://jsdelivr.net" />

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Dark background to highlight photography */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Prevents vertical scrolling */
        }

        /* Container that frames your presentation */
        .swiper {
            width: 90vw;
            max-width: 1200px;
            height: auto;
            aspect-ratio: 16 / 9; /* Matches standard Canva presentation dimensions */
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #121212;
        }

        /* Keeps images perfectly contained and sharp */
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        /* Customizes navigation arrow colours to match a minimal design */
        .swiper-button-next, .swiper-button-prev {
            color: #ffffff !important;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .swiper-button-next:hover, .swiper-button-prev:hover {
            opacity: 1;
        }

        /* Customizes pagination dots */
        .swiper-pagination-bullet {
            background: #ffffff !important;
        }
    </style>
</head>
<body>

    <!-- Slider Main Container -->
    <div class="swiper">
                <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <!-- Slide 1 & 2 load normally so the page opens instantly -->
            <div class="swiper-slide"><img src="images/1.png" alt="Slide 1"></div>
            <div class="swiper-slide"><img src="images/2.png" alt="Slide 2"></div>
            
            <!-- Slides 3 to 17 use loading="lazy" to stop the browser from getting stuck -->
            <div class="swiper-slide"><img src="images/3.png" alt="Slide 3" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/4.png" alt="Slide 4" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/5.png" alt="Slide 5" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/6.png" alt="Slide 6" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/7.png" alt="Slide 7" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/8.png" alt="Slide 8" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/9.png" alt="Slide 9" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/10.png" alt="Slide 10" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/11.png" alt="Slide 11" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/12.png" alt="Slide 12" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/13.png" alt="Slide 13" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/14.png" alt="Slide 14" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/15.png" alt="Slide 15" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/16.png" alt="Slide 16" loading="lazy"></div>
            <div class="swiper-slide"><img src="images/17.png" alt="Slide 17" loading="lazy"></div>
        </div>

        
        <!-- Navigation buttons (Arrows) -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- Pagination (Dots at the bottom) -->
        <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper.js Script (Handles the movement mechanics) -->
    <script src="https://jsdelivr.net"></script>

    <!-- Initialise Swiper -->
    <script>
        const swiper = new Swiper('.swiper', {
            loop: false, // Stops looping back to slide 1 at the end
            speed: 600,  // Animation speed in milliseconds (smooth presentation transition)
            
            // Enables arrow navigation
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },

            // Enables dots navigation
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },

            // Enables keyboard navigation (Left/Right arrows on Mac)
            keyboard: {
                enabled: true,
                onlyInViewport: true,
            },
        });
    </script>
</body>
</html>
